name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet pack src/Sanwo/Sanwo.csproj -c Release -o ./nupkg

      - name: Publish to NuGet
        uses: dotnet/publish-nuget-package@v1
        with:
          package-path: ./nupkg/SanwoHQ.1.0.0.nupkg
          nuget-api-url: https://api.nuget.org/v3/index.json
